openapi: 3.0.3
info:
  title: Учёт посещаемости занятий API
  description: API для системы учёта посещаемости занятий. Позволяет получать список занятий, отмечать присутствие студентов, запрашивать процент посещаемости и выявлять студентов с низкой посещаемостью.
  version: 1.0.0
  contact:
    name: Студент
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

paths:
  /classes:
    get:
      summary: Список занятий
      description: Возвращает список занятий с возможностью фильтрации по группе и предмету.
      parameters:
        - name: group_id
          in: query
          schema:
            type: string
            format: uuid
          description: Фильтр по группе
        - name: subject
          in: query
          schema:
            type: string
          description: Фильтр по названию предмета
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Class'
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /attendance:
    post:
      summary: Отметить присутствие
      description: Преподаватель или староста отмечает присутствие студентов на занятии.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '201':
          description: Отметки успешно сохранены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Занятие не найдено

  /students/{student_id}/attendance:
    get:
      summary: Процент посещаемости студента
      description: Возвращает статистику посещаемости конкретного студента.
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Статистика посещаемости
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAttendanceStats'
        '404':
          description: Студент не найден

  /students/low-attendance:
    get:
      summary: Студенты с низкой посещаемостью
      description: Возвращает список студентов, у которых процент посещаемости ниже установленного порога.
      parameters:
        - name: threshold
          in: query
          schema:
            type: number
            format: float
            default: 70.0
          description: Порог посещаемости в процентах
        - name: group_id
          in: query
          schema:
            type: string
            format: uuid
          description: Фильтр по группе
      responses:
        '200':
          description: Список студентов с низкой посещаемостью
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LowAttendanceStudent'

components:
  schemas:
    Class:
      type: object
      required:
        - id
        - subject
        - group_id
        - date
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
          example: Математика
        teacher_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
          example: '2026-11-27T10:00:00Z'
        duration_minutes:
          type: integer
          example: 90

    AttendanceRequest:
      type: object
      required:
        - class_id
        - records
      properties:
        class_id:
          type: string
          format: uuid
        records:
          type: array
          items:
            type: object
            required:
              - student_id
              - status
            properties:
              student_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [present, absent, late]
                example: present

    AttendanceResponse:
      type: object
      properties:
        class_id:
          type: string
          format: uuid
        marked_count:
          type: integer
          example: 25
        marked_at:
          type: string
          format: date-time

    StudentAttendanceStats:
      type: object
      properties:
        student_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: Иванов Иван Иванович
        total_classes:
          type: integer
          example: 40
        attended_classes:
          type: integer
          example: 32
        attendance_percentage:
          type: number
          format: float
          example: 80.0
        below_threshold:
          type: boolean
          example: false

    LowAttendanceStudent:
      type: object
      properties:
        student_id:
          type: string
          format: uuid
        full_name:
          type: string
        group_id:
          type: string
          format: uuid
        attendance_percentage:
          type: number
          format: float
          example: 65.5

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

  responses:
    BadRequest:
      description: Ошибка валидации запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Invalid request parameters
